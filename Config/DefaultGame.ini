PrivacyPolicy=PRIVACY POLICYLast Updated: [May, 21, 2026][Spicer Games] ("we," "our," or "us") is committed to protecting the privacy of our players. This Privacy Policy outlines how data is handled by our video game provisionally titled [Blacksmithing Game Name] (the "Game").1. NO PERSONAL DATA COLLECTIONWe do not collect, request, record, or store any Personal Information from you when you play the Game. "Personal Information" includes details such as your name, email address, physical address, phone number, phone/hardware contacts, or precise geolocation data. You can play the Game completely anonymously.2. LOCAL DATA STORAGE AND PROCESSINGThe Game operates primarily as an offline application. Any information generated by your gameplay activity—including your inventory progress, item configurations, system save registries, and game-generated screenshot file paths—lives entirely on your own local device. - This data is serialized locally on your hard drive.- We do not run or maintain external databases or cloud servers that capture, harvest, or store your save files.- If you delete the Game or manually wipe its application folders from your device, your local save progression data is permanently erased.3. THIRD-PARTY PLATFORMS AND TELEMETRYThe Game is distributed through digital distribution storefronts (such as Steam, Epic Games Store, or Itch.io). These third-party services may automatically collect aggregate, non-personal data according to their own independent privacy rules. This may include:- Operational metrics (e.g., installation data, download speeds).- Non-identifying technical specifications (e.g., operating system type, graphics card configurations for optimization metrics).- System crash dumps or automated error tracking generated via engine components.We do not control, manipulate, or possess individual tracking records from these storefronts. For more information, please consult the privacy policy of the store platform from which you downloaded the Game.4. CHILDREN'S PRIVACYBecause the Game does not collect, capture, or transmit any Personal Information from anyone, it complies fully with the Children’s Online Privacy Protection Act (COPPA) and General Data Protection Regulation (GDPR) mandates. We do not knowingly gather any details from children under the age of 13.5. CHANGES TO THIS PRIVACY POLICYWe reserve the right to modify this Privacy Policy at any time, particularly if we update the Game to support network-based features or online multiplayer tracking in future patches. Any modifications will be posted with an updated "Last Updated" timestamp.6. CONTACT INFORMATIONIf you have any questions or concerns regarding this policy, feel free to contact us at:[Spicer Games][spicergames.com]

