name: Discord Notify

on:
  push:
    branches:
      - main

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Target Notifications
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Error: DISCORD_WEBHOOK_URL secret not found."
            exit 1
          fi

          TITLE="Code Push"
          MSG="${{ github.event.head_commit.message }}"
          URL="${{ github.event.head_commit.url }}"
          REPO="${{ github.repository }}"
          USER="${{ github.actor }}"

          # 1. Fire Outbound Discord Packet (The main alert)
          echo "Building Discord payload..."
          DISCORD_PAYLOAD=$(jq -n \
            --arg un "SkySmith Bot" \
            --arg title "$TITLE" \
            --arg repo "$REPO" \
            --arg user "$USER" \
            --arg msg "$MSG" \
            --arg url "$URL" \
            '{username: $un, content: ("**\($title)**\n**Repo:** \($repo)\n**User:** \($user)\n**Content:** \($msg)\n**Link:** \($url)")}')
          
          echo "Dispatching to Discord channel..."
          curl -s -H "Content-Type: application/json" -d "$DISCORD_PAYLOAD" "$DISCORD_WEBHOOK"